name: Apollo Shield
description: 'ApolloShield develops counter-drone (counter-UAS / cUAS) systems that detect, classify, and
  neutralize unauthorized aerial threats. Its product suite spans RF detection sensors (omnidirectional
  Omni RF Sensor up to 1.5 km and directional sensors 2-5 km with triangulation), active-defense jammers
  (portable RF Gun under 4 kg, stationary, mobile, and vehicle-mounted RF Jammers), the integrated RF
  Sense&Block system, a CUAS vehicle, and a centralized Command Center that manages sensors and issues
  real-time alerts via SMS, email, and API. The platform uses AI-assisted RF fingerprinting to identify
  drone communications and can force unauthorized drones to return home. Command Center runs on-premise or
  cloud-based. Note: jammers cannot be sold in the United States except to federal government entities and
  require regulatory compliance in other jurisdictions. ApolloShield exposes no public developer API,
  documentation, SDK, or portal today; the only programmatic surface referenced is outbound Command Center
  alert delivery. Surfaced as a portfolio company of Partech.'
